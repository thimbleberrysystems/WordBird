<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A3A6B"/>
      <stop offset="100%" stop-color="#2E6DB4"/>
    </linearGradient>
    <linearGradient id="wingGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2058A8"/>
      <stop offset="100%" stop-color="#4A90D9"/>
    </linearGradient>
    <linearGradient id="quillGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5A623"/>
      <stop offset="100%" stop-color="#E8732A"/>
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F0F4FF"/>
      <stop offset="100%" stop-color="#DCE8FF"/>
    </linearGradient>
  </defs>

  <!-- Rounded square background -->
  <rect x="0" y="0" width="512" height="512" rx="110" ry="110" fill="url(#bgGrad)"/>

  <!-- ── Tail quill feathers (behind body) ── -->
  <!-- Outermost quill — long graceful sweep, amber -->
  <path d="M 185 310
             Q 130 350  90 420
             Q 105 390 120 360
             Q 140 325 160 305 Z"
        fill="url(#quillGrad)" opacity="0.55"/>
  <!-- Mid quill -->
  <path d="M 195 305
             Q 148 338  118 400
             Q 132 372 148 344
             Q 166 316 188 300 Z"
        fill="url(#quillGrad)" opacity="0.75"/>
  <!-- Inner quill — shortest, richest -->
  <path d="M 205 298
             Q 168 325 148 378
             Q 160 352 176 330
             Q 192 310 208 295 Z"
        fill="url(#quillGrad)"/>

  <!-- ── Wing — sweeping upward arc ── -->
  <path d="M 240 265
             Q 200 185  145 130
             Q 170 160  210 210
             Q 235 240  248 268 Z"
        fill="url(#wingGrad)" opacity="0.7"/>
  <path d="M 255 258
             Q 215 165  170 105
             Q 200 145  235 200
             Q 252 230  260 260 Z"
        fill="url(#wingGrad)" opacity="0.88"/>
  <!-- Primary wing feathers — bold sweep -->
  <path d="M 262 252
             Q 242 155  210 88
             Q 238 135  255 195
             Q 265 230  268 255 Z"
        fill="url(#bodyGrad)"/>

  <!-- ── Body ── -->
  <ellipse cx="295" cy="300" rx="95" ry="62"
           fill="url(#bodyGrad)"
           transform="rotate(-18 295 300)"/>

  <!-- ── Head ── -->
  <circle cx="366" cy="226" r="66" fill="url(#bodyGrad)"/>

  <!-- Beak -->
  <path d="M 424 228  Q 472 210  428 252 Z" fill="url(#quillGrad)"/>

  <!-- Eye -->
  <circle cx="384" cy="212" r="13" fill="white"/>
  <circle cx="386" cy="213" r="7"  fill="#0D1B3E"/>
  <circle cx="389" cy="210" r="3"  fill="white"/>

  <!-- ── Breast / belly highlight ── -->
  <ellipse cx="330" cy="318" rx="58" ry="36"
           fill="#3D7CC9" opacity="0.35"
           transform="rotate(-18 330 318)"/>

  <!-- ── Ink-stroke tail tip (quill nib) ── -->
  <path d="M 89 422  Q 82 440  96 435  Q 106 430 110 418  Q 100 422 89 422 Z"
        fill="#C8580A" opacity="0.9"/>
</svg>
