  <ellipse cx="308" cy="230" rx="44" ry="54" fill="#FFFFFF"/>
  <circle cx="212" cy="240" r="22" fill="#3B79D6"/>
  <circle cx="300" cy="240" r="22" fill="#3B79D6"/>
  <circle cx="215" cy="242" r="10" fill="#14213D"/>
  <circle cx="297" cy="242" r="10" fill="#14213D"/>
  <circle cx="220" cy="230" r="7" fill="#FFFFFF"/>
  <circle cx="305" cy="230" r="7" fill="#FFFFFF"/>

  <!-- Beak -->
  <path d="M 224 292 Q 256 278 288 292 Q 280 320 256 324 Q 232 320 224 292 Z" fill="#FF9F38"/>
  <path d="M 230 296 Q 256 308 282 296" fill="none" stroke="#E07818" stroke-width="6" stroke-linecap="round"/>

