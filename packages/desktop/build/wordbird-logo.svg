  <ellipse cx="360" cy="282" rx="20" ry="12" fill="#FFB37C" opacity="0.8"/>

  <!-- Open book -->
  <path d="M 60 398 Q 158 368 256 396 Q 354 368 452 398 L 452 456 Q 354 430 256 456 Q 158 430 60 456 Z" fill="#4F86C6"/>
  <path d="M 72 394 Q 164 366 256 392 Q 348 366 440 394 L 440 444 Q 348 421 256 444 Q 164 421 72 444 Z" fill="#FFFFFF"/>
  <line x1="256" y1="392" x2="256" y2="444" stroke="#D8DEE9" stroke-width="5"/>
  <path d="M 98 406 Q 168 388 234 404 M 98 420 Q 168 402 234 418 M 278 404 Q 344 388 414 406 M 278 418 Q 344 402 414 420"
        stroke="#C7D2E0" stroke-width="6" fill="none" stroke-linecap="round"/>

  <!-- Wing paws gripping the page edge -->
