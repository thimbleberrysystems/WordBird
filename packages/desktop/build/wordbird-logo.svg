<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1b2d5a"/>
      <stop offset="100%" stop-color="#0a1220"/>
    </linearGradient>
    <linearGradient id="bird" x1="10%" y1="0%" x2="90%" y2="100%">
      <stop offset="0%" stop-color="#ffd460"/>
      <stop offset="100%" stop-color="#e8920e"/>
    </linearGradient>
    <linearGradient id="wing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e8920e"/>
      <stop offset="100%" stop-color="#b86800"/>
    </linearGradient>
    <linearGradient id="quill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffd460"/>
      <stop offset="100%" stop-color="#cc7a0a"/>
    </linearGradient>
  </defs>

  <!-- Rounded square background -->
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>

  <!-- Subtle inner glow -->
  <rect width="512" height="512" rx="96" fill="none" stroke="#2a4080" stroke-width="3" opacity="0.4"/>

  <!-- Quill tail feathers — drawn before body so body overlaps naturally -->
  <!-- Outer left quill -->
  <path d="M 152 358 C 128 378 88 418 64 456 C 92 442 128 412 148 386 C 118 414 105 452 110 478 C 135 460 148 422 155 394 Z"
        fill="url(#quill)" opacity="0.85"/>
  <!-- Middle quill -->
  <path d="M 168 365 C 148 390 120 432 108 470 C 132 450 155 418 163 390 C 140 420 135 460 142 482 C 162 460 168 426 170 396 Z"
        fill="url(#quill)"/>
  <!-- Inner right quill -->
  <path d="M 188 370 C 172 396 158 438 155 474 C 175 452 188 420 192 394 C 174 422 172 460 178 480 C 196 458 200 426 198 398 Z"
        fill="url(#quill)" opacity="0.9"/>

  <!-- Wing sweep -->
  <path d="M 195 295 C 218 242 288 218 342 242 C 308 248 268 264 240 296 Z"
        fill="url(#wing)"/>

  <!-- Body -->
  <ellipse cx="268" cy="320" rx="96" ry="74" fill="url(#bird)" transform="rotate(-18 268 320)"/>

  <!-- Head -->
  <circle cx="340" cy="228" r="68" fill="url(#bird)"/>

  <!-- Eye -->
  <circle cx="365" cy="212" r="15" fill="#0a1220"/>
  <circle cx="370" cy="206" r="5" fill="white"/>

  <!-- Beak — pointed, elegant -->
  <path d="M 398 218 L 448 232 L 398 248 Z" fill="#b86800"/>

  <!-- Wing feather detail lines -->
  <path d="M 210 290 C 248 268 295 260 332 272" stroke="#b86800" stroke-width="2.5" fill="none" opacity="0.5"/>
  <path d="M 218 302 C 252 280 298 272 334 285" stroke="#b86800" stroke-width="2" fill="none" opacity="0.35"/>

  <!-- Tiny ink droplet beneath — writing motif -->
  <ellipse cx="310" cy="415" rx="12" ry="16" fill="#ffd460" opacity="0.18"/>
  <path d="M 310 399 L 316 415 Q 310 426 304 415 Z" fill="#ffd460" opacity="0.18"/>
</svg>
