    <path d="M 128 366 Q 108 374 108 392 Q 108 404 124 406 Q 118 396 126 390 Q 120 402 134 406 Q 130 396 138 391 Q 134 403 148 405 Q 156 402 156 390 Q 156 372 140 366 Z"/>
    <path d="M 384 366 Q 404 374 404 392 Q 404 404 388 406 Q 394 396 386 390 Q 392 402 378 406 Q 382 396 374 391 Q 378 403 364 405 Q 356 402 356 390 Q 356 372 372 366 Z"/>
