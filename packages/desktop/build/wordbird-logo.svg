<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FDF6E3"/>
      <stop offset="100%" stop-color="#F3E4BC"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFE45C"/>
      <stop offset="100%" stop-color="#FFC81F"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="110" fill="url(#bg)"/>

  <!-- Bird peeking over the book -->
  <circle cx="256" cy="248" r="152" fill="url(#body)"/>

  <!-- Head feathers -->
  <path d="M 230 106 Q 222 64 238 40 Q 248 76 248 102 Z" fill="#FFC81F"/>
  <path d="M 254 100 Q 258 54 278 36 Q 274 74 268 102 Z" fill="#FFE45C"/>
  <path d="M 280 108 Q 296 74 318 66 Q 306 98 292 114 Z" fill="#FFC81F"/>

  <!-- Eyes -->
